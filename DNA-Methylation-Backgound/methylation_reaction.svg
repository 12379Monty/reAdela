  <text x="380" y="350" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#555" text-anchor="middle" font-style="italic">A methyl group (red) is added at the 5 position of the cytosine ring; DNMT catalyses the transfer from S-adenosyl methionine (SAM).</text>
